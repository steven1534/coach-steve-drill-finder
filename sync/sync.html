<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Sync Drill Finder | Coach Steve</title>
  <link rel="preconnect" href="https://api.fontshare.com">
  <link href="https://api.fontshare.com/v2/css?f[]=clash-display@600,700&f[]=satoshi@400,500,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/sync.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <main id="main" class="sync-shell">
    <section class="sync-card" aria-labelledby="sync-title">
      <svg class="sync-logo" viewBox="0 0 40 40" fill="none" aria-label="Coach Steve Drill Finder">
        <circle cx="20" cy="20" r="16" stroke="currentColor" stroke-width="3"/>
        <path d="M11 8.5c4 6 4 17 0 23M29 8.5c-4 6-4 17 0 23" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
      <p class="eyebrow">Coach controls</p>
      <h1 id="sync-title">Sync Drill Finder</h1>
      <p class="lede">Pull every addition, edit, rename, and removal from the LIVE Drill Library, then publish the encrypted update.</p>

      <div id="authStage">
        <form id="loginForm" class="sync-form">
          <label for="email">Coach email</label>
          <input id="email" name="email" type="email" autocomplete="username" required data-testid="input-coach-email">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required data-testid="input-coach-password">
          <button type="submit" data-testid="button-coach-login">Continue</button>
        </form>

        <form id="mfaForm" class="sync-form" hidden>
          <label for="totp">Google Authenticator code</label>
          <input id="totp" name="totp" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required data-testid="input-coach-totp">
          <button type="submit" data-testid="button-verify-totp">Verify</button>
        </form>
      </div>

      <div id="readyStage" hidden>
        <div class="status-row">
          <span class="status-dot" aria-hidden="true"></span>
          <span>Coach MFA verified</span>
        </div>
        <dl class="sync-stats" id="syncStats">
          <div><dt>Last sync</dt><dd id="lastSync">Checking…</dd></div>
          <div><dt>Live drills</dt><dd id="liveCount">—</dd></div>
        </dl>
        <button id="syncButton" type="button" data-testid="button-sync-notion">Sync from Notion</button>
        <button id="logoutButton" type="button" class="secondary" data-testid="button-coach-logout">Sign out</button>
      </div>

      <div id="result" class="result" role="status" aria-live="polite"></div>
      <a class="back-link" href="/">Back to Drill Finder</a>
    </section>
  </main>
  <script type="module" src="/sync-client.js"></script>
</body>
</html>
