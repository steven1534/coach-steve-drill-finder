<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Sync Drill Finder | Coach Steve</title>
  <link rel="preconnect" href="https://api.fontshare.com">
  <link href="https://api.fontshare.com/v2/css?f[]=clash-display@600,700&f[]=satoshi@400,500,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/sync.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <main id="main" class="sync-shell">
    <section class="sync-card" aria-labelledby="sync-title">
      <svg class="sync-logo" viewBox="0 0 40 40" fill="none" aria-label="Coach Steve Drill Finder">
        <circle cx="20" cy="20" r="16" stroke="currentColor" stroke-width="3"/>
        <path d="M11 8.5c4 6 4 17 0 23M29 8.5c-4 6-4 17 0 23" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round"/>
      </svg>

      <p class="eyebrow">Coach controls</p>
      <h1 id="sync-title">Sync Drill Finder</h1>
      <p class="lede">Sign in below to pull the latest additions, edits, renames, and removals directly from your Notion Drill Library.</p>

      <dl class="sync-stats" id="syncStats">
        <div><dt>Last sync</dt><dd id="lastSync">Checking…</dd></div>
        <div><dt>Live drills</dt><dd id="liveCount">—</dd></div>
      </dl>

      <form id="syncForm" class="sync-form">
        <label for="email">Coach email</label>
        <input
          id="email"
          name="email"
          type="email"
          autocomplete="username"
          value="coachstevengoldstein@gmail.com"
          required
          data-testid="input-coach-email"
        >

        <label for="password">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          required
          data-testid="input-coach-password"
        >

        <button id="syncButton" type="submit" data-testid="button-sync-notion">
          Sync from Notion
        </button>
      </form>

      <div id="result" class="result" role="status" aria-live="polite"></div>
      <a class="back-link" href="/">Back to Drill Finder</a>
    </section>
  </main>
  <script src="/sync-client.js" defer></script>
</body>
</html>
